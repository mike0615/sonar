# Sonar master configuration - system-wide defaults.
#
# Each user can override any key in ~/.config/sonar/sonar.conf
# (Edit > Preferences in Sonar writes that file). Keys missing from both
# files use Sonar's built-in defaults, which match the values below.

[scan]
# Hosts probed in parallel (1-512) and the per-host timeout in milliseconds.
threads = 64
timeout_ms = 1000
# auto = unprivileged ICMP socket, then /usr/bin/ping, then a TCP connect
# probe on probe_ports. Force one with icmp, ping or tcp. Never needs root.
ping_method = auto
probe_ports = 80,443,22,445,139,3389,8080,53,21,23
# Ports checked on every live host. Ranges are allowed: 8000-8010.
ports = 21,22,23,25,53,80,110,135,139,143,443,445,3389,5900,8080,8443
scan_ports = yes
resolve_hostnames = yes
netbios = yes
show_dead = no

[launchers]
# Where the right-click "Open in Skiff" / "Open in MultiSSH Manager" programs
# live. If the path isn't executable, Sonar looks for the program name on
# PATH; if neither exists the menu entry is greyed out.
skiff_path = /usr/bin/skiff
multissh_path = /usr/bin/multissh-manager
# User name and SSH port for the generated entries (blank user = login name).
default_user =
ssh_port = 22
# Skiff 1.x has no host argument, so Sonar adds a "Sonar: <ip>" site to
# ~/.config/skiff/sites.json (if that host isn't saved already) and starts
# Skiff; pick it in the Site Manager (Ctrl+S). Set skiff_add_site = no to
# just start Skiff. skiff_args is appended to the command line; {host}
# {user} {port} are replaced (for a future Skiff with a host option).
skiff_add_site = yes
skiff_args =
# MultiSSH Manager accepts a session file as its only argument. Sonar writes
# a one-host session file and passes it as {session_file}.
multissh_args = {session_file}
# Command for "Open in browser"; blank uses the desktop default. {url}
browser_command =
